<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/global.css">
        <link rel="stylesheet" href="../css/recipes.css">
        <script src="../js/global.js"></script>
        <script src="../js/recipes.js"></script>
        <title>RecyShare - Recipes</title>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="left">
                    <div class="logo">
                        <img src="../assets/logos/recyshare-logo-no-text.png" alt="RecyShare Logo">
                        <h3>RecyShare</h3>
                    </div>
                </div>
                <div class="right">
                    <ul class="nav-links">
                        <li><a href="./home.html">Home</a></li>
                        <li><a href="./about.html">About</a></li>
                        <li class="active"><a href="./recipes.html">Recipes</a></li>
                        <li><a href="./categories.html">Categories</a></li>
                    </ul>
                    <div class="search-bar">
                        <img class="icon" src="../assets/icons/search_48dp_000000_FILL0_wght300_GRAD200_opsz48.png" alt="Search">
                        <input type="search" id="searchBar" placeholder="Search...">
                    </div>
                    <div class="account">
                        <img class="icon" src="../assets/icons/account_circle_48dp_000000_FILL0_wght300_GRAD200_opsz48.png" alt="Account">
                    </div>
                </div>
            </nav>
            <div class="recipes-container">
                <h1>Recipes</h1>
                <div class="recipes-list" id="recipesList">
                    <!-- Recipe items will be dynamically inserted here -->
                </div>
            </div>
        </header>
        <template id="recipeTemplate">
            <div class="recipe-card">
                <div id="removeBtn">
                    <img class="icon" src="../assets/icons/delete_48dp_000000_FILL0_wght300_GRAD200_opsz48.png" alt="Remove">
                </div>
                <div class="recipe-image" id="recipeImage">
                    <img src="https://placehold.co/250x160/025b3f/2ec68a/?text=Sample+Recipe\n- 1 -" alt="Sample Recipe">
                </div>
                <h3 class="recipe-title" id="recipeTitle">Sample Recipe Title</h3>
                <p class="recipe-description" id="recipeDescription">A brief description of the sample recipe.</p>
                <div class="btn">
                    <a id="recipeLink" href="./recipe-detail.html">View Recipe</a>
                </div>
            </div>
        </template>
    </body>
</html>
